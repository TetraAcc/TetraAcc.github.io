backend:
  name: github
  repo: TetraAcc/TetraAcc.github.io
  branch: main
  base_url: https://cms-auth.tetrahrt.workers.dev

# Visual & Branding
app_title: 'Tetra Studio · 内容管理'
logo:
  src: '/images/avatar.jpg'

# Media upload settings
media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

# UI configuration
locale: 'zh_CN'
site_url: 'https://tetraacc.me'
display_url: 'https://tetraacc.me'
show_preview_links: true

collections:
  - name: 'manuscripts'
    label: '📚 手稿企划 (Manuscripts)'
    label_singular: '手稿企划'
    folder: 'src/content/blog/manuscripts'
    create: true
    slug: '{{slug}}'
    sortable_fields:
      - field: publishDate
        label: '发布日期 (Publish Date)'
        default_sort: desc
      - field: title
        label: '标题 (Title)'
      - field: commit_date
        label: '修改时间 (Last Modified)'
    fields:
      - { label: '标题 (Title)', name: 'title', widget: 'string' }
      - { label: '简介描述 (Description)', name: 'description', widget: 'string', required: false }
      - { label: '发布日期 (Publish Date)', name: 'publishDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: '标签 (Tags)', name: 'tags', widget: 'list', default: ['手稿企划', '长篇文集'] }
      - { label: '置顶 (Pin)', name: 'pin', widget: 'boolean', default: false, required: false }
      - { label: '草稿 (Draft)', name: 'draft', widget: 'boolean', default: false }
      - label: '正文内容 (Markdown)'
        name: 'body'
        widget: 'markdown'
        modes:
          - 'rich_text'
          - 'raw'

  - name: 'essays'
    label: '📝 散文随笔 (Essays)'
    label_singular: '随笔'
    folder: 'src/content/blog/essays'
    create: true
    slug: '{{slug}}'
    sortable_fields:
      - field: publishDate
        label: '发布日期 (Publish Date)'
        default_sort: desc
      - field: title
        label: '标题 (Title)'
      - field: commit_date
        label: '修改时间 (Last Modified)'
    fields:
      - { label: '标题 (Title)', name: 'title', widget: 'string' }
      - { label: '简介描述 (Description)', name: 'description', widget: 'string', required: false }
      - { label: '发布日期 (Publish Date)', name: 'publishDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: '标签 (Tags)', name: 'tags', widget: 'list', default: ['随笔'] }
      - { label: '置顶 (Pin)', name: 'pin', widget: 'boolean', default: false, required: false }
      - { label: '草稿 (Draft)', name: 'draft', widget: 'boolean', default: false }
      - label: '正文内容 (Markdown)'
        name: 'body'
        widget: 'markdown'
        modes:
          - 'rich_text'
          - 'raw'

  - name: 'journals'
    label: '📅 编年日记 (Journals)'
    label_singular: '日记合辑'
    folder: 'src/content/blog/journals'
    create: true
    slug: '{{slug}}'
    sortable_fields:
      - field: publishDate
        label: '年份/日期 (Date)'
        default_sort: desc
      - field: title
        label: '标题 (Title)'
      - field: commit_date
        label: '修改时间 (Last Modified)'
    fields:
      - { label: '标题 (Title)', name: 'title', widget: 'string' }
      - { label: '简介描述 (Description)', name: 'description', widget: 'string', required: false }
      - { label: '年份/日期 (Date)', name: 'publishDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: '标签 (Tags)', name: 'tags', widget: 'list', default: ['日记', '编年记事'] }
      - { label: '草稿 (Draft)', name: 'draft', widget: 'boolean', default: false }
      - label: '日记正文 (Markdown)'
        name: 'body'
        widget: 'markdown'
        modes:
          - 'rich_text'
          - 'raw'

  # 可视化配置文件集合
  - name: 'settings'
    label: '⚙️ 站点配置与近况 (Settings)'
    files:
      - name: 'now'
        label: '🌱 个人近况 (Now)'
        file: 'src/content/now.json'
        format: 'json'
        fields:
          - { label: '状态/常驻地 (Status)', name: 'status', widget: 'string', default: '日本山形 · 工学生活与日常' }
          - { label: '更新日期 (Updated Date)', name: 'updated', widget: 'string', default: '2026-11' }
          - { label: '正在阅读 (Reading)', name: 'reading', widget: 'string', required: false }
          - { label: '正在收听 (Listening)', name: 'listening', widget: 'string', required: false }
          - { label: '正在进行/手稿 (Working On)', name: 'working', widget: 'string', required: false }
          - { label: '近况寄语/碎碎念 (Note)', name: 'note', widget: 'text', required: false }
      - name: 'links'
        label: '🔗 友链与灵感站列表 (Links)'
        file: 'public/links.json'
        format: 'json'
        fields:
          - label: '友链分组 (Friends Groups)'
            name: 'friends'
            widget: 'list'
            fields:
              - { label: '分组标识 (ID)', name: 'id_name', widget: 'string' }
              - { label: '分组说明 (Desc)', name: 'desc', widget: 'string' }
              - label: '成员链接列表 (Links)'
                name: 'link_list'
                widget: 'list'
                fields:
                  - { label: '站点名称 (Name)', name: 'name', widget: 'string' }
                  - { label: '站点简介 (Intro)', name: 'intro', widget: 'string' }
                  - { label: '站点链接 (URL)', name: 'link', widget: 'string' }
                  - { label: '头像图片 (Avatar URL)', name: 'avatar', widget: 'string' }
