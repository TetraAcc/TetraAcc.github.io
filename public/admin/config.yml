backend:
  name: github
  repo: TetraAcc/TetraAcc.github.io
  branch: main
  base_url: https://cms-auth.tetrahrt.workers.dev

# Visual & Branding
app_title: 'Tetra Studio'
logo:
  src: '/images/avatar.jpg'

# Media upload settings
media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

# UI configuration
locale: 'zh_CN'
site_url: 'https://tetraacc.me'
display_url: 'https://tetraacc.me'
show_preview_links: true

collections:
  - name: 'manuscripts'
    label: '📚 手稿企划 (Manuscripts)'
    label_singular: '手稿企划'
    folder: 'src/content/blog/manuscripts'
    create: true
    slug: '{{slug}}'
    preview_path: 'blog/manuscripts/{{slug}}'
    summary: '{{fields.title}} ({{fields.publishDate}})'
    sortable_fields:
      - field: publishDate
        label: '发布日期 (Publish Date)'
        default_sort: desc
      - field: title
        label: '标题 (Title)'
      - field: commit_date
        label: '修改时间 (Last Modified)'
    fields:
      - { label: '标题 (Title)', name: 'title', widget: 'string' }
      - { label: '简介描述 (Description)', name: 'description', widget: 'string', required: false }
      - { label: '发布日期 (Publish Date)', name: 'publishDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: '标签 (Tags)', name: 'tags', widget: 'list', default: ['手稿企划', '长篇文集'] }
      - label: '封面题图 (Hero Image)'
        name: 'heroImage'
        widget: 'object'
        required: false
        fields:
          - { label: '图片地址 (Image)', name: 'src', widget: 'image', required: false }
          - { label: '主色调 (Color)', name: 'color', widget: 'string', default: '#282828', required: false }
          - { label: '替代文本 (Alt)', name: 'alt', widget: 'string', required: false }
      - { label: '置顶 (Pin)', name: 'pin', widget: 'boolean', default: false, required: false }
      - { label: '开启评论 (Comment)', name: 'comment', widget: 'boolean', default: true }
      - { label: '草稿 (Draft)', name: 'draft', widget: 'boolean', default: false }
      - label: '正文内容 (Markdown)'
        name: 'body'
        widget: 'markdown'
        modes:
          - 'rich_text'
          - 'raw'

  - name: 'essays'
    label: '📝 散文随笔 (Essays)'
    label_singular: '随笔'
    folder: 'src/content/blog/essays'
    create: true
    slug: '{{slug}}'
    preview_path: 'blog/essays/{{slug}}'
    summary: '{{fields.title}} ({{fields.publishDate}})'
    sortable_fields:
      - field: publishDate
        label: '发布日期 (Publish Date)'
        default_sort: desc
      - field: title
        label: '标题 (Title)'
      - field: commit_date
        label: '修改时间 (Last Modified)'
    view_filters:
      - label: '草稿 (Drafts)'
        field: draft
        pattern: true
      - label: '已发布 (Published)'
        field: draft
        pattern: false
      - label: '影评 (Reviews)'
        field: tags
        pattern: '影评'
      - label: '书信 (Letters)'
        field: tags
        pattern: '书信'
      - label: '诗歌 (Poems)'
        field: tags
        pattern: '诗歌'
    view_groups:
      - label: '按年份 (Year)'
        field: publishDate
        pattern: '\d{4}'
    fields:
      - { label: '标题 (Title)', name: 'title', widget: 'string' }
      - { label: '简介描述 (Description)', name: 'description', widget: 'string', required: false }
      - { label: '发布日期 (Publish Date)', name: 'publishDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: '标签 (Tags)', name: 'tags', widget: 'list', default: ['随笔', '短文'], hint: '常用标签：随笔、短文、长文、影评、书信、诗歌（自动联动长卷三语国际化）' }
      - label: '封面题图 (Hero Image)'
        name: 'heroImage'
        widget: 'object'
        required: false
        fields:
          - { label: '图片地址 (Image)', name: 'src', widget: 'image', required: false }
          - { label: '主色调 (Color)', name: 'color', widget: 'string', default: '#282828', required: false }
          - { label: '替代文本 (Alt)', name: 'alt', widget: 'string', required: false }
      - { label: '置顶 (Pin)', name: 'pin', widget: 'boolean', default: false, required: false }
      - { label: '开启评论 (Comment)', name: 'comment', widget: 'boolean', default: true }
      - { label: '草稿 (Draft)', name: 'draft', widget: 'boolean', default: false }
      - label: '正文内容 (Markdown)'
        name: 'body'
        widget: 'markdown'
        modes:
          - 'rich_text'
          - 'raw'

  # 可视化配置文件集合
  - name: 'settings'
    label: '⚙️ 站点配置与近况 (Settings)'
    files:
      - name: 'now'
        label: '🌱 个人近况 (Now)'
        file: 'src/content/now.json'
        format: 'json'
        fields:
          - { label: '状态 (Status)', name: 'status', widget: 'string', default: '山形 · 日常' }
          - { label: '更新日期 (Updated Date)', name: 'updated', widget: 'string', default: '2026-11-10' }
          - label: '近况条目列表 (可自由增删/拖拽排序)'
            name: 'items'
            widget: 'list'
            summary: '{{fields.icon}} {{fields.label}}: {{fields.content}}'
            fields:
              - { label: '图标 (Emoji)', name: 'icon', widget: 'string', default: '📌' }
              - { label: '栏目名称 (Label)', name: 'label', widget: 'string', default: '正在进行' }
              - { label: '内容 (Content)', name: 'content', widget: 'string' }
          - { label: '碎碎念 (Note)', name: 'note', widget: 'text', required: false }
      - name: 'links'
        label: '🔗 友链与灵感站列表 (Links)'
        file: 'public/links.json'
        format: 'json'
        fields:
          - label: '友链分组 (Friends Groups)'
            name: 'friends'
            widget: 'list'
            fields:
              - { label: '分组标识 (ID)', name: 'id_name', widget: 'string' }
              - { label: '分组说明 (Desc)', name: 'desc', widget: 'string' }
              - label: '成员链接列表 (Links)'
                name: 'link_list'
                widget: 'list'
                fields:
                  - { label: '站点名称 (Name)', name: 'name', widget: 'string' }
                  - { label: '站点简介 (Intro)', name: 'intro', widget: 'string' }
                  - { label: '站点链接 (URL)', name: 'link', widget: 'string' }
                  - { label: '头像图片 (Avatar URL)', name: 'avatar', widget: 'string' }
      - name: 'projects'
        label: '💻 开源项目与工具 (Projects)'
        file: 'src/content/projects.json'
        format: 'json'
        fields:
          - label: '开源项目列表 (可拖拽增删与调整顺序)'
            name: 'projects'
            widget: 'list'
            summary: '{{fields.name}}'
            fields:
              - { label: '项目名称 (建议含 Emoji)', name: 'name', widget: 'string' }
              - label: '项目描述 (多语言)'
                name: 'description'
                widget: 'object'
                fields:
                  - { label: '中文描述 (ZH)', name: 'zh', widget: 'text' }
                  - { label: '日文描述 (JA - 可选，不填默认回退中文)', name: 'ja', widget: 'text', required: false }
                  - { label: '英文描述 (EN - 可选，不填默认回退中文)', name: 'en', widget: 'text', required: false }
              - label: '关联链接 (Links)'
                name: 'links'
                widget: 'list'
                fields:
                  - label: '链接类型 (Type)'
                    name: 'type'
                    widget: 'select'
                    options:
                      - { label: 'GitHub 仓库 (github)', value: 'github' }
                      - { label: '网站 / Demo (site)', value: 'site' }
                      - { label: '文档 / 指南 (doc)', value: 'doc' }
                      - { label: '发布包 / Release (release)', value: 'release' }
                    default: 'github'
                  - { label: '链接地址 (URL)', name: 'href', widget: 'string' }
      - name: 'bilibili'
        label: '📻 B 站视频与电台 (Bilibili)'
        file: 'src/content/bilibili.json'
        format: 'json'
        fields:
          - label: '视频合集分类 (双极电台 / 翻唱演奏 / 现场见证)'
            name: 'sections'
            widget: 'list'
            summary: '{{fields.title.zh}}'
            fields:
              - { label: '专栏标识 (ID)', name: 'id', widget: 'string' }
              - label: '专栏标题 (Title)'
                name: 'title'
                widget: 'object'
                fields:
                  - { label: '中文 (ZH)', name: 'zh', widget: 'string' }
                  - { label: '日文 (JA)', name: 'ja', widget: 'string' }
                  - { label: '英文 (EN)', name: 'en', widget: 'string' }
              - label: '专栏描述 (Description)'
                name: 'description'
                widget: 'object'
                fields:
                  - { label: '中文 (ZH)', name: 'zh', widget: 'string' }
                  - { label: '日文 (JA)', name: 'ja', widget: 'string' }
                  - { label: '英文 (EN)', name: 'en', widget: 'string' }
              - { label: 'B 站对应合集/系列链接 (Series URL)', name: 'seriesUrl', widget: 'string', required: false }
              - label: '精选视频卡片列表 (可拖拽排序/增删)'
                name: 'items'
                widget: 'list'
                summary: '{{fields.tag}} · {{fields.title}} ({{fields.date}})'
                fields:
                  - { label: 'BV 号 (如 BV1KpWB6LE4L)', name: 'bvid', widget: 'string' }
                  - { label: '视频标题 (Title)', name: 'title', widget: 'string' }
                  - { label: '标签 (如 Vol. 05 / Acoustic)', name: 'tag', widget: 'string', default: 'Vol. 05' }
                  - { label: '简介/碎碎念 (Desc)', name: 'desc', widget: 'string' }
                  - { label: '发布年月 (如 2026.11)', name: 'date', widget: 'string', default: '2026.11' }
                  - { label: '封面图片链接 (Pic URL)', name: 'pic', widget: 'string' }
      - name: 'gear'
        label: '⌨️ 装备与环境清单 (Gear & Setup)'
        file: 'src/content/gear.json'
        format: 'json'
        fields:
          - label: '装备分组列表 (计算显示/外设交互/音频/移动智能)'
            name: 'sections'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: '分组标题 (Title)', name: 'title', widget: 'string' }
              - label: '物品列表 (可拖拽排序/增删)'
                name: 'items'
                widget: 'list'
                summary: '{{fields.icon}} {{fields.name}} [{{fields.tag}}]'
                fields:
                  - { label: '设备名称 (Name)', name: 'name', widget: 'string' }
                  - { label: '规格参数 (Spec)', name: 'spec', widget: 'string', required: false }
                  - { label: '使用说明与体验 (Desc)', name: 'desc', widget: 'string' }
                  - { label: '图标 Emoji (Icon)', name: 'icon', widget: 'string', default: '💻' }
                  - { label: '类别标签 (Tag，如 Laptop, Mouse, Phone)', name: 'tag', widget: 'string', default: 'Gear' }
      - name: 'skills'
        label: '🛠️ 个人技能栈 (Skills)'
        file: 'src/content/skills.json'
        format: 'json'
        fields:
          - { label: '编程语言 (Languages)', name: 'languages', widget: 'list' }
          - { label: '工具与框架 (Tools & Frameworks)', name: 'tools', widget: 'list' }
          - { label: '运行环境与系统 (Environment)', name: 'environment', widget: 'list' }
      - name: 'timeline'
        label: '📜 建站时间轴日志 (Timeline)'
        file: 'src/content/site-timeline.json'
        format: 'json'
        fields:
          - label: '里程碑事件列表 (可拖拽排序/增删)'
            name: 'events'
            widget: 'list'
            summary: '{{fields.date}}: {{fields.content.zh}}'
            fields:
              - { label: '事件日期 (YYYY-MM-DD)', name: 'date', widget: 'string' }
              - label: '事件内容 (支持 HTML 链接与代码标签)'
                name: 'content'
                widget: 'object'
                fields:
                  - { label: '中文 (ZH)', name: 'zh', widget: 'text' }
                  - { label: '日文 (JA - 可选，不填默认回退中文)', name: 'ja', widget: 'text', required: false }
                  - { label: '英文 (EN - 可选，不填默认回退中文)', name: 'en', widget: 'text', required: false }
